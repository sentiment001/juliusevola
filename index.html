<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>try{var t=localStorage.getItem("theme");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
  <meta name="theme-color" id="themeColor" content="#F7F3ED">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julius Evola Daily — A Daily Reader for Young Men</title>
  <meta name="description" content="A 365-day reader drawn from Julius Evola's Revolt Against the Modern World and Ride the Tiger. Written for young men who want a clearer standard than the one the age offers.">
  <meta name="keywords" content="Julius Evola, Tradition, Ride the Tiger, Revolt Against the Modern World, daily reader, differentiated individual, Traditionalism, hierarchy, young men">
  <meta name="author" content="Julius Evola Daily">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Julius Evola Daily — A Daily Reader for Young Men">
  <meta property="og:description" content="A 365-day reader drawn from Julius Evola's core works. Orientation, diagnosis, and the stance required to remain upright in a late age.">
  <meta property="og:url" content="https://sentiment001.github.io/juliusevola/">
  <meta property="og:image" content="https://sentiment001.github.io/juliusevola/cover.jpg">
  <meta property="og:site_name" content="Julius Evola Daily">
  <link rel="canonical" href="https://sentiment001.github.io/juliusevola/">
  <link rel="stylesheet" href="style.css">
  <style>
    .month-nav { margin: 2.5rem 0 2rem; }
    .month-nav label { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.6rem; }
    .month-select { width: 100%; max-width: 320px; padding: 0.7rem 1rem; font-size: 1rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; appearance: none; cursor: pointer; }
    .month-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.25rem; color: var(--accent); }
    .day-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem 2.5rem; margin-top: 0.5rem; }
    .day-list { list-style: none; margin: 0; padding: 0; }
    .day-list li { margin-bottom: 0.7rem; }
    .day-list a { font-size: 1.02rem; }
    .coming { color: var(--muted); font-size: 0.95rem; }
    @media (max-width: 600px) { .day-columns { grid-template-columns: 1fr; gap: 0.5rem; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>Julius Evola Daily</h1>
        <nav>
          <a href="index.html" class="active">Home</a>
          <a href="day-01.html">Start Day 1</a>
        </nav>
      </div>
      <button class="theme-toggle" id="themeToggle">Night</button>
    </header>
    <div class="landing-intro">
      <p>A daily reader drawn from the core of Julius Evola's work. Written for young men who feel the narrowness of the age they were born into and want a clearer standard.</p>
    </div>
    <div class="month-nav">
      <label for="monthSelect">Month</label>
      <select id="monthSelect" class="month-select">
        <option value="1">January (Day 1 – Day 31)</option>
        <option value="2">February (Day 32 – Day 59)</option>
        <option value="3">March (Day 60 – Day 90)</option>
        <option value="4">April (Day 91 – Day 120)</option>
        <option value="5">May (Day 121 – Day 151)</option>
        <option value="6">June (Day 152 – Day 181)</option>
        <option value="7">July (Day 182 – Day 212)</option>
        <option value="8">August (Day 213 – Day 243)</option>
        <option value="9">September (Day 244 – Day 273)</option>
        <option value="10">October (Day 274 – Day 304)</option>
        <option value="11">November (Day 305 – Day 334)</option>
        <option value="12">December (Day 335 – Day 365)</option>
      </select>
    </div>
    <div id="monthContent" aria-live="polite"></div>
    <div class="footer">Primary sources: Revolt Against the Modern World · Ride the Tiger · Men Among the Ruins</div>
  </div>
  <script src="realDays.js"></script>
  <script>
    const monthRanges = {1:[1,31],2:[32,59],3:[60,90],4:[91,120],5:[121,151],6:[152,181],7:[182,212],8:[213,243],9:[244,273],10:[274,304],11:[305,334],12:[335,365]};
    const monthNames = {1:"January",2:"February",3:"March",4:"April",5:"May",6:"June",7:"July",8:"August",9:"September",10:"October",11:"November",12:"December"};
    function renderMonth(m) {
      const [start, end] = monthRanges[m];
      const mid = Math.floor((start + end) / 2);
      function listHtml(from, to) {
        let html = '<ul class="day-list">';
        for (let d = from; d <= to; d++) {
          if (realDays[d]) {
            html += '<li><a href="' + realDays[d].link + '">Day ' + d + ' \u2014 ' + realDays[d].title + '</a></li>';
          } else {
            html += '<li><a href="day.html?d=' + d + '" class="coming">Day ' + d + ' \u2014 Coming soon</a></li>';
          }
        }
        html += '</ul>';
        return html;
      }
      document.getElementById('monthContent').innerHTML =
        '<div class="month-title">' + monthNames[m] + ' (Day ' + start + ' \u2013 Day ' + end + ')</div>' +
        '<div class="day-columns"><div>' + listHtml(start, mid) + '</div><div>' + listHtml(mid + 1, end) + '</div></div>';
      if (window.onMonthRendered) window.onMonthRendered();
    }
    const select = document.getElementById('monthSelect');
    function rememberMonthQuery(m) {
      const params = new URLSearchParams(location.search);
      params.set('m', m);
      const q = params.toString();
      history.replaceState(null, '', q ? ('?' + q) : location.pathname);
    }
    select.addEventListener('change', () => { renderMonth(select.value); rememberMonthQuery(select.value); });
    const startMonth = new URLSearchParams(location.search).get('m');
    if (startMonth && monthRanges[startMonth]) select.value = startMonth;
    renderMonth(select.value);
  </script>
  <script src="theme.js" defer></script>
</body>
</html>
