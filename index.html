    const monthRanges = {
      1: [1, 31],
      2: [32, 59],
      3: [60, 90],
      4: [91, 120],
      5: [121, 151],
      6: [152, 181],
      7: [182, 212],
      8: [213, 243],
      9: [244, 273],
      10: [274, 304],
      11: [305, 334],
      12: [335, 365]
    };

    const monthNames = {
      1: "January", 2: "February", 3: "March", 4: "April",
      5: "May", 6: "June", 7: "July", 8: "August",
      9: "September", 10: "October", 11: "November", 12: "December"
    };

    function renderMonth(m) {
      const [start, end] = monthRanges[m];
      const mid = Math.floor((start + end) / 2);
      function listHtml(from, to) {
        let html = `<ul class=\"day-list\">`;
        for (let d = from; d <= to; d++) {
          if (realDays[d]) {
            html += `<li><a href=\"${realDays[d].link}\">Day ${d} — ${realDays[d].title}</a></li>`;
          } else {
            html += `<li><a href=\"day.html?d=${d}\" class=\"coming\">Day ${d} — Coming soon</a></li>`;
          }
        }
        html += `</ul>`;
        return html;
      }
      const html = `
        <div class=\"month-title\">${monthNames[m]} (Day ${start} – Day ${end})</div>
        <div class=\"day-columns\">
          <div>${listHtml(start, mid)}</div>
          <div>${listHtml(mid + 1, end)}</div>
        </div>`;
      document.getElementById('monthContent').innerHTML = html;
    }

    const select = document.getElementById('monthSelect');
    select.addEventListener('change', () => {
      renderMonth(select.value);
      history.replaceState(null, '', '?m=' + select.value);
    });
    const startMonth = new URLSearchParams(location.search).get('m');
    if (startMonth && monthRanges[startMonth]) select.value = startMonth;
    renderMonth(select.value);

  </script>
