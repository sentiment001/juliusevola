name: Seed quote cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
          python3 -m pip install --quiet Pillow

      - name: Render days 265-273
        run: python3 scripts/seed_quote_cards.py

      - name: Commit cards
        run: |
          git config user.name "sentiment001"
          git config user.email "mash@hirecmo.io"
          git add quotes/*.png
          if git diff --cached --quiet; then
            echo "no new cards"
          else
            git commit -m "Add quote cards for days 265-273"
            git push
          fi
