<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Path Navigation</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .path-section {
      margin: 2.5rem 0 4rem;
    }

    .path-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.25rem;
    }

    .path-header h2 {
      margin-bottom: 0;
    }

    .path-hint {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .path-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2.5rem 0 1.5rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .path-track {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 0;
      min-width: max-content;
      padding: 0 2rem 0 1rem;
      height: 160px;
    }

    /* The horizontal line */
    .path-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 42px;
      height: 2px;
      background: linear-gradient(to right, var(--border), var(--accent));
      z-index: 1;
    }

    .day-node {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 110px;
      cursor: pointer;
      z-index: 2;
      transition: transform 0.2s ease;
    }

    .day-node:hover {
      transform: translateY(-6px);
    }

    .day-node:hover .day-dot {
      background: var(--accent);
      border-color: var(--accent);
    }

    .day-node:hover .day-label {
      color: var(--text);
    }

    .day-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--accent);
      margin-bottom: 0.6rem;
      transition: all 0.2s ease;
    }

    .day-num {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }

    .day-label {
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.3;
      color: var(--muted);
      max-width: 100px;
      transition: color 0.2s ease;
    }

    /* Phase markers */
    .phase-marker {
      position: absolute;
      bottom: 70px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
      z-index: 3;
    }

    .phase-1 { left: 20px; }
    .phase-2 { left: 580px; }

    /* Rising effect: later nodes sit slightly higher */
    .day-node:nth-child(n+7) {
      margin-bottom: 12px;
    }
    .day-node:nth-child(n+9) {
      margin-bottom: 22px;
    }

    .selected-info {
      margin-top: 2rem;
      padding: 1.5rem;
      background: var(--quote-bg);
      border-left: 3px solid var(--accent);
      min-height: 90px;
    }

    .selected-info h3 {
      font-size: 1.15rem;
      margin-bottom: 0.4rem;
    }

    .selected-info p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }

    .selected-info a {
      font-weight: 500;
    }

    .empty-state {
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>Julius Evola Daily</h1>
        <nav>
          <a href="index.html">Home</a>
          <a href="nav-concepts.html">Concepts</a>
          <a href="nav-horizontal.html" class="active">Path</a>
        </nav>
      </div>
      <button class="theme-toggle" id="themeToggle">Night</button>
    </header>

    <div class="path-section">
      <div class="path-header">
        <h2>The Path</h2>
        <div class="path-hint">Scroll horizontally · Click a day</div>
      </div>

      <div class="path-scroll">
        <div class="path-track" id="track">
          <div class="path-line"></div>

          <div class="phase-marker phase-1">Orientation</div>
          <div class="phase-marker phase-2">Differentiated Man</div>

          <!-- Days will be injected here -->
        </div>
      </div>

      <div class="selected-info" id="info">
        <p class="empty-state">Select a day on the path</p>
      </div>
    </div>

    <div class="footer">
      Horizontal path · Early days on the left · Later material moves right and rises
    </div>
  </div>

  <script>
    const days = [
      { num: 1, title: "What Tradition Means", link: "day-01.html" },
      { num: 2, title: "Vertical and Horizontal", link: "day-02.html" },
      { num: 3, title: "Quality and Quantity", link: "day-03.html" },
      { num: 4, title: "The Lost Center", link: "day-04.html" },
      { num: 5, title: "Tradition and Traditionalism", link: "day-05.html" },
      { num: 6, title: "Higher and Lower Ways of Being", link: "day-06.html" },
      { num: 7, title: "The Type of Man Required", link: "day-07.html" },
      { num: 8, title: "Myth as Higher Knowledge", link: "day-08.html" },
      { num: 9, title: "The Condition of the Age", link: "day-09.html" },
      { num: 10, title: "Why This Matters", link: "day-10.html" }
    ];

    const track = document.getElementById('track');
    const info = document.getElementById('info');

    days.forEach(d => {
      const node = document.createElement('div');
      node.className = 'day-node';
      node.innerHTML = `
        <div class="day-dot"></div>
        <div class="day-num">Day ${String(d.num).padStart(2, '0')}</div>
        <div class="day-label">${d.title}</div>
      `;
      node.addEventListener('click', () => {
        info.innerHTML = `
          <h3>Day ${d.num}</h3>
          <p>${d.title}</p>
          <a href="${d.link}">Open this day →</a>
        `;
      });
      track.appendChild(node);
    });

    // Theme toggle
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      html.setAttribute('data-theme', 'dark');
      toggle.textContent = 'Day';
    }
    toggle.addEventListener('click', () => {
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        toggle.textContent = 'Night';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        toggle.textContent = 'Day';
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
</body>
</html>
